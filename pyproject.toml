[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mpsio-eco"
version = "1.0.0"
description = "Research code for MPSIO-ECO single-lead ECG representation learning"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Ehsan Forootani" },
  { name = "Farbod Khodadadi Aski" },
  { name = "Shervin Mahmoudi" },
  { name = "Ali Masoudi-Nejad" },
]
dependencies = [
  "torch>=2.2",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "PyYAML>=6.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
